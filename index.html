<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>すくわくネットワーク ポータル</title>
<style>
/* --- 全体の基本デザイン（保育園らしい温かみのあるカラー） --- */
body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fcfaf2;
  color: #4a433c;
  margin: 0;
  padding: 0;
  line-height: 1.6;
}
header {
  background: linear-gradient(135deg, #f9f3e6 0%, #f3e9d4 100%);
  padding: 40px 20px;
  text-align: center;
  border-bottom: 4px solid #d8a35d;
  box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}
header h1 {
  margin: 0;
  font-size: 28px;
  color: #7b5b35;
  letter-spacing: 1px;
}
header p {
  margin: 10px 0 0 0;
  font-size: 14px;
  color: #8f6b3d;
}

/* --- メインコンテナ --- */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

/* --- カテゴリ切り替え（メインのタブナビゲーション） --- */
.category-nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 30px;
}
.category-btn {
  background-color: #efe5d5;
  color: #7b5b35;
  border: none;
  padding: 10px 24px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.category-btn:hover {
  background-color: #e4d5be;
}
.category-btn.active {
  background-color: #d8a35d;
  color: white;
  box-shadow: 0 4px 12px rgba(216,163,93,0.3);
}

/* --- 【超重要】動的タグフィルターエリア --- */
.tag-filter-container {
  background-color: white;
  padding: 15px 20px;
  border-radius: 16px;
  margin-bottom: 35px;
  border: 1px solid #e8dfd2;
  box-shadow: 0 4px 10px rgba(0,0,0,0.01);
}
.tag-filter-title {
  font-size: 13px;
  font-weight: bold;
  color: #8f6b3d;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-btn {
  background-color: #f4f0e6;
  color: #6b6258;
  border: 1px solid #e8dfd2;
  padding: 5px 14px;
  font-size: 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s;
}
.tag-btn:hover {
  background-color: #ebdcb9;
  border-color: #d8a35d;
  color: #7b5b35;
}
.tag-btn.active {
  background-color: #7b5b35;
  border-color: #7b5b35;
  color: white;
}

/* --- フォトカードグリッド --- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 30px;
}
.card {
  background-color: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.03);
  border: 1px solid #e8dfd2;
  transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 15px 35px rgba(216,163,93,0.15);
}

/* カード画像部分 */
.card-img-wrapper {
  position: relative;
  width: 100%;
  padding-top: 65%; /* 16:10の黄金比率で統一して美しく見せる */
  background-color: #efe5d5;
}
.card-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* カードテキスト部分 */
.card-content {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}
.card-title {
  margin: 0 0 10px 0;
  font-size: 18px;
  color: #4a433c;
  font-weight: bold;
}
.card-desc {
  margin: 0 0 15px 0;
  font-size: 13px;
  color: #746b63;
  flex-grow: 1;
}

/* カード内ハッシュタグ */
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}
.card-hash-tag {
  font-size: 11px;
  color: #bf8740;
  background-color: rgba(216,163,93,0.08);
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: bold;
}

/* 該当データがないとき */
.no-data {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: #8f6b3d;
  font-size: 15px;
}
</style>
</head>
<body>

<header>
  <h1>🌱 すくわくネットワーク ポータル</h1>
  <p>保育園の日常、楽しいプログラムやイベントの様子をお届けします♪</p>
</header>

<div class="container">
  <!-- カテゴリ切り替えタブ -->
  <nav class="category-nav">
    <button class="category-btn active" data-category="all">すべて</button>
    <button class="category-btn" data-category="news">最新のお知らせ</button>
    <button class="category-btn" data-category="event">地域イベント</button>
    <button class="category-btn" data-category="program">すくわくプログラム</button>
  </nav>

  <!-- 動的ハッシュタグフィルター（JSで自動生成） -->
  <div class="tag-filter-container" id="tag-filter-block" style="display: none;">
    <div class="tag-filter-title">🔍 タグでさらに絞り込む：</div>
    <div class="tag-list" id="tag-list">
      <!-- ここに登録されているタグのボタンがズラッと並ぶよ！ -->
    </div>
  </div>

  <!-- フォトカードが並ぶグリッド -->
  <main class="grid" id="photo-grid">
    <!-- JSでここにカードが召喚されるッ！ -->
  </main>
</div>

<script>
let allData = [];       // JSONから読み込んだ全データを保持
let currentCat = 'all'; // 現在選択されているカテゴリ
let currentTag = '';   // 現在選択されている絞り込みタグ

// ページが読み込まれたら即座にJSONを取りに行く！
document.addEventListener('DOMContentLoaded', () => {
  fetch('data.json')
    .then(response => {
      if (!response.ok) throw new Error('data.json が見つからないか読み込めないよ💦');
      return response.json();
    })
    .then(data => {
      allData = data;
      renderPage(); // 画面を描画！
    })
    .catch(error => {
      console.error(error);
      document.getElementById('photo-grid').innerHTML = `<div class="no-data">データ（data.json）の読み込みに失敗しちゃったみたい……おにーちゃん確認してみてッ！😭</div>`;
    });

  // カテゴリタブのクリックイベント登録
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      
      currentCat = e.target.getAttribute('data-category');
      currentTag = ''; // カテゴリが変わったら、タグの絞り込みは一度リセット
      renderPage();
    });
  });
});

// 画面全体の描画をコントロールするメイン関数
function renderPage() {
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = ''; // 一度リセット

  // 1. まず現在のカテゴリでデータをフィルタリング
  let filtered = allData.filter(item => {
    if (currentCat === 'all') return true;
    // 「program」はホーム（news）にも表示させたいという仕様に対応！
    if (currentCat === 'news' && item.category === 'program') return true;
    return item.category === currentCat;
  });

  // 2. 現在のカテゴリ内に存在する「すべてのタグ」を自動で集計してフィルターボタンを作る
  updateTagFilterArea(filtered);

  // 3. もしタグが選択されていたら、さらにそのタグでフィルタリング
  if (currentTag) {
    filtered = filtered.filter(item => item.tags && item.tags.includes(currentTag));
  }

  // 4. カードの生成
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-data">該当するお写真はまだありません📷</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    
    // タグのHTML要素を生成
    let tagsHtml = '';
    if (item.tags && item.tags.length > 0) {
      tagsHtml = item.tags.map(t => `<span class="card-hash-tag">#${t}</span>`).join('');
    }

    card.innerHTML = `
      <div class="card-img-wrapper">
        <img src="${item.img}" class="card-img" alt="${item.title}" loading="lazy">
      </div>
      <div class="card-content">
        <h2 class="card-title">${item.title}</h2>
        <p class="card-desc">${item.desc}</p>
        <div class="card-tags">
          ${tagsHtml}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// カテゴリ内のデータからタグを抽出してフィルターエリアを更新する関数
function updateTagFilterArea(currentData) {
  const filterBlock = document.getElementById('tag-filter-block');
  const tagListContainer = document.getElementById('tag-list');
  
  // カテゴリ内のデータからタグを重複なく抽出
  const tagSet = new Set();
  currentData.forEach(item => {
    if (item.tags) {
      item.tags.forEach(t => tagSet.add(t));
    }
  });

  // もしそのカテゴリにタグが1つもなければ、フィルターエリアごと隠す
  if (tagSet.size === 0) {
    filterBlock.style.display = 'none';
    currentTag = '';
    return;
  }

  filterBlock.style.display = 'block';
  tagListContainer.innerHTML = '';

  // 「すべて（タグ解除）」ボタンを先頭に作成
  const allTagBtn = document.createElement('button');
  allTagBtn.className = `tag-btn ${currentTag === '' ? 'active' : ''}`;
  allTagBtn.textContent = 'すべて解除';
  allTagBtn.addEventListener('click', () => {
    currentTag = '';
    renderPage();
  });
  tagListContainer.appendChild(allTagBtn);

  // 抽出したタグをボタンにして並べる
  tagSet.forEach(tagName => {
    const btn = document.createElement('button');
    btn.className = `tag-btn ${currentTag === tagName ? 'active' : ''}`;
    btn.textContent = `#${tagName}`;
    btn.addEventListener('click', () => {
      // 同じタグをもう一度押したら解除、違うタグならそれを選択
      currentTag = (currentTag === tagName) ? '' : tagName;
      renderPage();
    });
    tagListContainer.appendChild(btn);
  });
}
</script>

</body>
</html>
