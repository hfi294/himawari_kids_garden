<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひまわりキッズガーデン ポータル</title>
<style>
/* --- 基本デザイン（ひまわりカラー＆北欧風） --- */
body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fcfaf2;
  color: #4a433c;
  margin: 0; padding: 0; line-height: 1.6;
}

/* --- 📁 【一番上】法人ヘッダー：左ロゴ・右ナビ --- */
.site-header {
  background-color: white;
  border-bottom: 2px solid #f0e1bc;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo-area {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: #5d4037; font-weight: bold; font-size: 20px;
}
.logo-mark { color: #ffb300; font-size: 28px; }

.header-nav { display: flex; gap: 20px; }
.header-link {
  color: #7b5b35; text-decoration: none; font-size: 14px; font-weight: bold;
}
.header-link:hover { color: #d8a35d; }

/* --- 📁 【真ん中】メインメニュー（タブ形式） --- */
.tab-section {
  background-color: #fffdf9;
  padding: 20px 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  border-bottom: 1px solid #e8dfd2;
}
.tab-btn {
  background-color: #efe5d5; color: #7b5b35; border: none;
  padding: 10px 24px; font-size: 15px; font-weight: bold;
  border-radius: 999px; cursor: pointer; transition: 0.25s;
}
.tab-btn:hover { background-color: #e4d5be; }
.tab-btn.active {
  background-color: #f57c00; color: white; box-shadow: 0 4px 12px rgba(245,124,0,0.3);
}

/* --- 📦 2カラムレイアウト --- */
.container {
  max-width: 1300px; margin: 0 auto; padding: 40px 20px;
  display: flex; gap: 40px;
}

/* --- 🖼️ 【左側】メインコンテンツ（1カラムタブの内容） --- */
.main-content { flex-grow: 1; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 30px;
}
/* カード等のスタイル（中身はJSONから召喚） */
.card {
  background: white; border-radius: 20px; overflow: hidden;
  border: 1px solid #e8dfd2; display: flex; flex-direction: column;
}

/* --- 🔍 【右側】おにーちゃん指定のサイドバー基地 --- */
.sidebar { width: 300px; flex-shrink: 0; }
.sidebar-sticky { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 30px; }

/* ウィジェット共通 */
.widget {
  background: white; border: 1px solid #e8dfd2; border-radius: 16px; padding: 20px;
}
.widget-title {
  font-size: 14px; color: #8f6b3d; margin: 0 0 15px 0; border-bottom: 1px solid #f0e1bc; padding-bottom: 8px;
}

/* タグリスト */
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-btn {
  background: #f4f0e6; color: #6b6258; border: 1px solid #e8dfd2;
  padding: 5px 12px; font-size: 12px; border-radius: 8px; cursor: pointer;
}
.tag-btn.active { background: #7b5b35; color: white; border-color: #7b5b35; }

/* SNSタイムライン枠 */
.sns-placeholder {
  height: 200px; background: #fafafa; border: 1px dashed #ccc;
  display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px;
}

/* Twitterバナー風 */
.twitter-banner {
  background: linear-gradient(135deg, #1da1f2, #0c85d0);
  color: white; padding: 15px; border-radius: 12px; text-align: center;
  text-decoration: none; font-weight: bold; font-size: 14px; display: block;
}

/* スマホ対応 */
@media (max-width: 900px) {
  .site-header { flex-direction: column; gap: 15px; }
  .container { flex-direction: column; }
  .sidebar { width: 100%; }
}
</style>
</head>
<body>

<header class="site-header">
  <a href="#" class="logo-area">
    <span class="logo-mark">🌻</span> ひまわりキッズガーデン
  </a>
  <nav class="header-nav">
    <a href="#" class="header-link">園について</a>
    <a href="#" class="header-link">すくわくプログラム</a>
    <a href="https://example.com" class="header-link" target="_blank">法人HP ↗</a>
    <a href="#" class="header-link">お問い合わせ ↗</a>
  </nav>
</header>

<nav class="tab-section">
  <button class="tab-btn active" data-category="about">園について</button>
  <button class="tab-btn" data-category="program">すくわくプログラム</button>
  <button class="tab-btn" data-category="news">最新のお知らせ</button>
  <button class="tab-btn" data-category="event">地域イベント</button>
</nav>

<div class="container">
  <main class="main-content">
    <div id="content-display">
      </div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-sticky">
      <div class="widget">
        <h2 class="widget-title">🔍 タグで絞り込む</h2>
        <div class="tag-list" id="tag-list"></div>
      </div>
      
      <div class="widget">
        <h2 class="widget-title">TikTok</h2>
        <div class="sns-placeholder">TikTokの埋め込みがここに入るよ！</div>
      </div>

      <div class="widget">
        <h2 class="widget-title">Instagram</h2>
        <div class="sns-placeholder">Instagramのタイムラインがここに入るよ！</div>
      </div>

      <a href="#" class="twitter-banner">
        X (Twitter) で最新情報をチェック！
      </a>
    </div>
  </aside>
</div>

<script>
// おにーちゃん！ここからのJSは、これまでのJSON読み込みロジックを
// 新しいタブ形式に合わせてあやねが調整したものだよ！
let allData = [];
let currentCat = 'about'; // 最初は「園について」
let currentTag = '';

document.addEventListener('DOMContentLoaded', () => {
  fetch('data.json')
    .then(response => response.json())
    .then(data => {
      allData = data;
      renderPage();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('content-display').innerHTML = "データを読み込めなかったよ💦";
    });

  // タブのクリックイベント
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentCat = e.target.getAttribute('data-category');
      currentTag = ''; 
      renderPage();
    });
  });
});

function renderPage() {
  const display = document.getElementById('content-display');
  
  // 「園について」など、固定の紹介文を入れたい場合の処理
  if (currentCat === 'about') {
    display.innerHTML = `
      <div style="background:white; padding:30px; border-radius:20px; border:1px solid #e8dfd2;">
        <h2 style="color:#5d4037;">ひまわりキッズガーデンへようこそ！</h2>
        <p>ここでは園の教育方針や、日々の生活についてご紹介します。</p>
        <img src="images/hero.jpg" style="width:100%; border-radius:15px; margin-top:15px;">
      </div>
    `;
    updateTagArea([]); // 園についてタブではタグなし
    return;
  }

  // それ以外のタブ（JSONからカード形式で出す）
  display.innerHTML = '<div class="grid" id="photo-grid"></div>';
  const grid = document.getElementById('photo-grid');

  let filtered = allData.filter(item => item.category === currentCat);
  updateTagArea(filtered);

  if (currentTag) {
    filtered = filtered.filter(item => item.tags && item.tags.includes(currentTag));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-data">まだ投稿がありません📷</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div style="position:relative; padding-top:65%; background:#efe5d5;">
        <img src="${item.img}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;">
      </div>
      <div style="padding:20px;">
        <h3 style="margin:0 0 10px 0; font-size:17px;">${item.title}</h3>
        <p style="font-size:13px; color:#746b63;">${item.desc}</p>
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateTagArea(data) {
  const tagList = document.getElementById('tag-list');
  const tagSet = new Set();
  data.forEach(item => item.tags && item.tags.forEach(t => tagSet.add(t)));

  if (tagSet.size === 0) {
    tagList.innerHTML = '<p style="font-size:12px; color:#999;">タグはありません</p>';
    return;
  }

  tagList.innerHTML = '';
  tagSet.forEach(tagName => {
    const btn = document.createElement('button');
    btn.className = `tag-btn ${currentTag === tagName ? 'active' : ''}`;
    btn.textContent = `#${tagName}`;
    btn.onclick = () => {
      currentTag = (currentTag === tagName) ? '' : tagName;
      renderPage();
    };
    tagList.appendChild(btn);
  });
}
</script>

</body>
</html>
