<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひまわりキッズガーデン ポータル</title>
<style>
/* --- 基本デザイン（ひまわりカラー＆温かみのある北欧風） --- */
body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fcfaf2;
  color: #4a433c;
  margin: 0; padding: 0; line-height: 1.6;
}

/* --- 📁 【一番上】ロゴ以外をすべて右寄せにした洗練ヘッダー --- */
.site-header {
  background-color: white;
  border-bottom: 2px solid #f0e1bc;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between; /* ロゴとメニューを両端にバシッと分けるよ！ */
  align-items: center;
}
.logo-area {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: #5d4037; font-weight: bold; font-size: 20px;
}
.logo-mark { color: #ffb300; font-size: 28px; }

/* ロゴ以外のメニューを右側に綺麗に並べるエリア */
.header-right-menu {
  display: flex;
  align-items: center;
  gap: 25px;
}
.corporate-link {
  color: #7b5b35; text-decoration: none; font-size: 14px; font-weight: bold;
  transition: color 0.2s;
}
.corporate-link:hover { color: #d8a35d; }

/* --- 🌟 【復活ッ！】ヘッダーのすぐ下にドカンと構えるヒーローイメージ --- */
.hero-section {
  position: relative;
  width: 100%;
  height: 360px;
  background: #efe5d5 url('images/hero.jpg') center/cover no-repeat;
  display: flex; align-items: center; justify-content: center;
}
.hero-section::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(74, 67, 60, 0.35); /* 写真が綺麗に馴染むスモーク効果 */
}
.hero-content {
  position: relative; z-index: 1; text-align: center; color: white; padding: 0 20px;
}
.hero-content h1 {
  margin: 0; font-size: 36px; font-weight: bold; text-shadow: 0 2px 12px rgba(0,0,0,0.3); letter-spacing: 2px;
}
.hero-content p {
  margin: 12px 0 0 0; font-size: 15px; text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* --- 📁 【真ん中】おにーちゃん指定配列のメインメニュー（タブ） --- */
.tab-section {
  background-color: #fffdf9;
  padding: 20px 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  border-bottom: 1px solid #e8dfd2;
}
.tab-btn {
  background-color: #efe5d5; color: #7b5b35; border: none;
  padding: 10px 24px; font-size: 15px; font-weight: bold;
  border-radius: 999px; cursor: pointer; transition: 0.25s;
}
.tab-btn:hover { background-color: #e4d5be; }
.tab-btn.active {
  background-color: #f57c00; color: white; box-shadow: 0 4px 12px rgba(245,124,0,0.3);
}

/* --- 📦 2カラムメインコンテナ --- */
.container {
  max-width: 1300px; margin: 0 auto; padding: 40px 20px;
  display: flex; gap: 40px;
}

/* --- 🖼️ 【左側】広々メインコンテンツエリア --- */
.main-content { flex-grow: 1; }

/* 1カラムタブ（園について、すくわくプログラム）の時の美しいボックス */
.one-column-box {
  background: white; padding: 35px; border-radius: 20px; border: 1px solid #e8dfd2;
  box-shadow: 0 6px 20px rgba(0,0,0,0.01);
}
.one-column-title { color: #5d4037; font-size: 24px; margin-top: 0; margin-bottom: 15px; }

/* お知らせ・イベントの時の写真グリッド */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 30px;
}
.card {
  background: white; border-radius: 20px; overflow: hidden;
  border: 1px solid #e8dfd2; display: flex; flex-direction: column;
  box-shadow: 0 6px 20px rgba(0,0,0,0.02); transition: transform 0.25s;
}
.card:hover { transform: translateY(-5px); }

/* --- 🔍 【右側】おにーちゃん指定のサイドバー基地（タグ＋TikTok＋Insta＋Twitter） --- */
.sidebar { width: 300px; flex-shrink: 0; }
.sidebar-sticky { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 30px; }

/* ウィジェットの共通デザイン */
.widget {
  background: white; border: 1px solid #e8dfd2; border-radius: 16px; padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.01);
}
.widget-title {
  font-size: 14px; color: #8f6b3d; margin: 0 0 15px 0; border-bottom: 1px solid #f0e1bc; padding-bottom: 8px;
  font-weight: bold; letter-spacing: 1px;
}

/* タグボタン */
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-btn {
  background: #f4f0e6; color: #6b6258; border: 1px solid #e8dfd2;
  padding: 5px 12px; font-size: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s;
}
.tag-btn.active { background: #7b5b35; color: white; border-color: #7b5b35; }

/* SNS埋め込み用プレースホルダー */
.sns-timeline {
  height: 250px; background: #fafafa; border: 1px dashed #d0c5b4; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; color: #9a8f84; font-size: 12px;
}

/* X (Twitter) バナー */
.twitter-banner {
  background: linear-gradient(135deg, #1da1f2, #0c85d0);
  color: white; padding: 18px; border-radius: 14px; text-align: center;
  text-decoration: none; font-weight: bold; font-size: 14px; display: block;
  box-shadow: 0 4px 15px rgba(29,161,242,0.2); transition: transform 0.2s;
}
.twitter-banner:hover { transform: scale(1.02); }

  .header-right-menu { flex-wrap: wrap; justify-content: center; gap
