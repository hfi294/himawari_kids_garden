<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>すくわくネットワーク ポータル</title>
<style>
/* --- 全体の基本デザイン（温かみのある北欧・保育園風カラー） --- */
body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fcfaf2;
  color: #4a433c;
  margin: 0;
  padding: 0;
  line-height: 1.6;
}

/* --- 🌟 ヒーローイメージ（最上部のデカい主役画像エリア） --- */
.hero-section {
  position: relative;
  width: 100%;
  height: 400px;
  background: #efe5d5 url('images/hero.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(74, 67, 60, 0.4);
}
.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  color: white;
  padding: 0 20px;
}
.hero-content h1 {
  margin: 0;
  font-size: 36px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  letter-spacing: 2px;
}
.hero-content p {
  margin: 15px 0 0 0;
  font-size: 16px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* --- メインコンテナ --- */
.container {
  max-width: 1300px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* --- 📁 【上部配置】カテゴリ切り替えメニュー（横並び） --- */
.category-nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 40px;
  border-bottom: 2px solid #e8dfd2;
  padding-bottom: 20px;
}
.category-btn {
  background-color: #efe5d5;
  color: #7b5b35;
  border: none;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.category-btn:hover {
  background-color: #e4d5be;
}
.category-btn.active {
  background-color: #d8a35d;
  color: white;
  box-shadow: 0 4px 12px rgba(216,163,93,0.3);
}

/* --- 📦 左右入れ替え！2カラムレイアウト --- */
.main-layout {
  display: flex;
  gap: 40px; /* カラム間の隙間 */
}

/* --- 🖼️ 【左カラム・メイン】フォトカードグリッド --- */
.content-area {
  flex-grow: 1;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* 自動で2〜3カラムに並ぶ */
  gap: 30px;
}
.card {
  background-color: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.02);
  border: 1px solid #e8dfd2;
  transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 15px 35px rgba(216,163,93,0.12);
}
.card-img-wrapper {
  position: relative;
  width: 100%;
  padding-top: 65%;
  background-color: #efe5d5;
}
.card-img {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover;
}
.card-content {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}
.card-title {
  margin: 0 0 10px 0;
  font-size: 17px;
  color: #4a433c;
  font-weight: bold;
}
.card-desc {
  margin: 0 0 15px 0;
  font-size: 13px;
  color: #746b63;
  flex-grow: 1;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}
.card-hash-tag {
  font-size: 11px;
  color: #bf8740;
  background-color: rgba(216,163,93,0.06);
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: bold;
}
.no-data {
  text-align: center;
  padding: 40px 20px;
  color: #8f6b3d;
  font-size: 15px;
}

/* --- 🔍 【右カラム・サイドバー】タグフィルター基地 --- */
.sidebar {
  width: 280px;
  flex-shrink: 0;
}
.sidebar-sticky {
  position: sticky;
  top: 20px; /* スクロール追従機能 */
}
.tag-block {
  background: white;
  border: 1px solid #e8dfd2;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.01);
}
.tag-block h2 {
  font-size: 14px;
  color: #8f6b3d;
  margin-top: 0;
  margin-bottom: 15px;
  letter-spacing: 1px;
}
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-btn {
  background-color: #f4f0e6;
  color: #6b6258;
  border: 1px solid #e8dfd2;
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.tag-btn:hover {
  background-color: #ebdcb9;
  border-color: #d8a35d;
  color: #7b5b35;
}
.tag-btn.active {
  background-color: #7b5b35;
  border-color: #7b5b35;
  color: white;
}

/* --- スマホ対応（画面が狭くなったら縦1カラムへ） --- */
@media (max-width: 900px) {
  .category-nav {
    flex-wrap: wrap;
    gap: 10px;
  }
  .category-btn {
    flex: 1 1 40%;
    padding: 10px;
    font-size: 13px;
    text-align: center;
  }
  .main-layout {
    flex-direction: column-reverse; /* スマホでは写真を上、タグを下に並べる */
  }
  .sidebar {
    width: 100%;
  }
  .sidebar-sticky {
    position: static;
  }
}
</style>
</head>
<body>

<!-- 🌟 ヒーローセクション -->
<div class="hero-section">
  <div class="hero-content">
    <h1>🌱 すくわくネットワーク ポータル</h1>
    <p>子どもたちの笑顔あふれる日常と、ワクワクするプログラムを配信中！</p>
  </div>
</div>

<div class="container">
  
  <!-- 📁 おにーちゃん指定：上部（ヘッダー下）の横並びカテゴリメニュー -->
  <nav class="category-nav">
    <button class="category-btn active" data-category="all">すべて表示</button>
    <button class="category-btn" data-category="news">最新のお知らせ</button>
    <button class="category-btn" data-category="event">地域イベント</button>
    <button class="category-btn" data-category="program">すくわくプログラム</button>
  </nav>

  <!-- 📦 2カラムレイアウト（左：メイン、右：タグ） -->
  <div class="main-layout">
    
    <!-- 🖼️ 左側：メインカード表示エリア -->
    <main class="content-area">
      <div class="grid" id="photo-grid">
        <!-- ここにカードが並ぶよ！ -->
      </div>
    </main>

    <!-- 🔍 おにーちゃん指定：右側のタグフィルター基地 -->
    <aside class="sidebar">
      <div class="sidebar-sticky">
        <div class="tag-block" id="tag-filter-block" style="display: none;">
          <h2>🔍 タグでさらに絞り込む</h2>
          <div class="tag-list" id="tag-list"></div>
        </div>
      </div>
    </aside>

  </div>
</div>

<script>
let allData = [];
let currentCat = 'all';
let currentTag = '';

document.addEventListener('DOMContentLoaded', () => {
  fetch('data.json')
    .then(response => {
      if (!response.ok) throw new Error('data.json が読み込めないよ💦');
      return response.json();
    })
    .then(data => {
      allData = data;
      renderPage();
    })
    .catch(error => {
      console.error(error);
      document.getElementById('photo-grid').innerHTML = `<div class="no-data">データの読み込みに失敗しちゃった……配置を確認してみてね、おにーちゃん！😭</div>`;
    });

  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentCat = e.target.getAttribute('data-category');
      currentTag = ''; 
      renderPage();
    });
  });
});

function renderPage() {
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = '';

  let filtered = allData.filter(item => {
    if (currentCat === 'all') return true;
    if (currentCat === 'news' && item.category === 'program') return true;
    return item.category === currentCat;
  });

  updateTagFilterArea(filtered);

  if (currentTag) {
    filtered = filtered.filter(item => item.tags && item.tags.includes(currentTag));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-data">該当するお写真はまだありません📷</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    let tagsHtml = '';
    if (item.tags && item.tags.length > 0) {
      tagsHtml = item.tags.map(t => `<span class="card-hash-tag">#${t}</span>`).join('');
    }

    card.innerHTML = `
      <div class="card-img-wrapper">
        <img src="${item.img}" class="card-img" alt="${item.title}" loading="lazy">
      </div>
      <div class="card-content">
        <h2 class="card-title">${item.title}</h2>
        <p class="card-desc">${item.desc}</p>
        <div class="card-tags">${tagsHtml}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateTagFilterArea(currentData) {
  const filterBlock = document.getElementById('tag-filter-block');
  const tagListContainer = document.getElementById('tag-list');
  const tagSet = new Set();
  
  currentData.forEach(item => {
    if (item.tags) item.tags.forEach(t => tagSet.add(t));
  });

  if (tagSet.size === 0) {
    filterBlock.style.display = 'none';
    currentTag = '';
    return;
  }

  filterBlock.style.display = 'block';
  tagListContainer.innerHTML = '';

  const allTagBtn = document.createElement('button');
  allTagBtn.className = `tag-btn ${currentTag === '' ? 'active' : ''}`;
  allTagBtn.textContent = 'すべて解除';
  allTagBtn.addEventListener('click', () => {
    currentTag = '';
    renderPage();
  });
  tagListContainer.appendChild(allTagBtn);

  tagSet.forEach(tagName => {
    const btn = document.createElement('button');
    btn.className = `tag-btn ${currentTag === tagName ? 'active' : ''}`;
    btn.textContent = `#${tagName}`;
    btn.addEventListener('click', () => {
      currentTag = (currentTag === tagName) ? '' : tagName;
      renderPage();
    });
    tagListContainer.appendChild(btn);
  });
}
</script>

</body>
</html>
