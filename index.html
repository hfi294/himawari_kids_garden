<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひまわりキッズガーデン ポータル</title>
<style>
/* --- 基本デザイン（ひまわりカラー＆温かみのある北欧風） --- */
body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fcfaf2;
  color: #4a433c;
  margin: 0; padding: 0; line-height: 1.6;
}

/* --- 📁 【1. トップバー】ロゴを左、指定の5メニューを【右寄せ】にがっちり配置 --- */
.site-header {
  background-color: white;
  border-bottom: 2px solid #f0e1bc;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo-area {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: #5d4037; font-weight: bold; font-size: 20px;
}
.logo-mark { color: #ffb300; font-size: 28px; }

.top-nav { display: flex; gap: 25px; }
.top-nav-item {
  color: #7b5b35; text-decoration: none; font-size: 14px; font-weight: bold;
  cursor: pointer; transition: color 0.2s; padding-bottom: 4px;
}
.top-nav-item:hover, .top-nav-item.active {
  color: #f57c00; border-bottom: 2px solid #f57c00;
}

/* --- 🌟 【2. ヒーローイメージ】ヘッダーのすぐ下 --- */
.hero-section {
  position: relative; width: 100%; height: 350px;
  background: #efe5d5 url('images/hero.jpg') center/cover no-repeat;
  display: flex; align-items: center; justify-content: center;
}
.hero-section::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(74, 67, 60, 0.35);
}
.hero-content {
  position: relative; z-index: 1; text-align: center; color: white; padding: 0 20px;
}
.hero-content h1 { margin: 0; font-size: 34px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); letter-spacing: 2px; }

/* --- 📁 【3. 真ん中のメニューバー】TOPの時だけ表示される3タブ！ --- */
.middle-tab-bar {
  background-color: #fffdf9; padding: 20px 0;
  display: flex; justify-content: center; gap: 15px;
  border-bottom: 1px solid #e8dfd2;
}
.tab-btn {
  background-color: #efe5d5; color: #7b5b35; border: none;
  padding: 10px 24px; font-size: 15px; font-weight: bold;
  border-radius: 999px; cursor: pointer; transition: 0.25s;
}
.tab-btn:hover { background-color: #e4d5be; }
.tab-btn.active {
  background-color: #f57c00; color: white; box-shadow: 0 4px 12px rgba(245,124,0,0.3);
}

/* --- 📦 【4. 2カラムメインコンテナ】 --- */
.container {
  max-width: 1300px; margin: 0 auto; padding: 40px 20px;
  display: flex; gap: 40px;
}

/* --- 🖼️ 【左側】広々メインコンテンツエリア --- */
.main-content { flex-grow: 1; }

/* 写真カードグリッド（TOPタブ用） */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 30px;
}
.card {
  background: white; border-radius: 20px; overflow: hidden;
  border: 1px solid #e8dfd2; display: flex; flex-direction: column;
  box-shadow: 0 6px 20px rgba(0,0,0,0.02); transition: transform 0.25s;
}
.card:hover { transform: translateY(-5px); }

/* 1カラム風の綺麗な紹介ボックス（園について・すくわく用） */
.info-box {
  background: white; padding: 40px; border-radius: 20px; border: 1px solid #e8dfd2;
  box-shadow: 0 6px 20px rgba(0,0,0,0.01); line-height: 1.8;
}
.info-box h2 { color: #5d4037; font-size: 24px; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #ffb300; padding-bottom: 10px; }

/* --- 🔍 【右側】サイドバー基地（タグ ＞ TikTok ＞ Insta ＞ Twitter） --- */
.sidebar { width: 300px; flex-shrink: 0; }
.sidebar-sticky { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 30px; }

.widget {
  background: white; border: 1px solid #e8dfd2; border-radius: 16px; padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.01);
}
.widget-title {
  font-size: 14px; color: #8f6b3d; margin: 0 0 15px 0; border-bottom: 1px solid #f0e1bc; padding-bottom: 8px; font-weight: bold; letter-spacing: 1px;
}
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-btn {
  background: #f4f0e6; color: #6b6258; border: 1px solid #e8dfd2;
  padding: 5px 12px; font-size: 11px; border-radius: 8px; cursor: pointer; transition: 0.2s;
}
.tag-btn.active { background: #7b5b35; color: white; border-color: #7b5b35; }

.sns-placeholder {
  height: 200px; background: #fafafa; border: 1px dashed #d0c5b4; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; color: #9a8f84; font-size: 12px; text-align: center;
}

.twitter-banner {
  background: linear-gradient(135deg, #1da1f2, #0c85d0);
  color: white; padding: 18px; border-radius: 14px; text-align: center;
  text-decoration: none; font-weight: bold; font-size: 14px; display: block;
  box-shadow: 0 4px 15px rgba(29,161,242,0.2); transition: transform 0.2s;
}
.twitter-banner:hover { transform: scale(1.02); }

/* スマホ対応 */
@media (max-width: 900px) {
  .site-header { flex-direction: column; padding: 15px; }
  .top-nav { flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
  .container { flex-direction: column; }
  .sidebar { width: 100%; }
}
</style>
</head>
<body>

<header class="site-header">
  <a href="#" class="logo-area">
    <span class="logo-mark">🌻</span> ひまわりキッズガーデン
  </a>
  <nav class="top-nav">
    <div class="top-nav-item active" data-tab="top" onclick="switchTopNav('top')">TOP</div>
    <div class="top-nav-item" data-tab="about" onclick="switchTopNav('about')">園について</div>
    <div class="top-nav-item" data-tab="program" onclick="switchTopNav('program')">すくわくプログラム</div>
    <a href="https://example.com" class="top-nav-item" target="_blank">法人HP ↗</a>
    <a href="#" class="top-nav-item">お問い合わせ ↗</a>
  </nav>
</header>

<div class="hero-section">
  <div class="hero-content">
    <h1 id="hero-title">🌻 ひまわりキッズガーデン ポータル</h1>
  </div>
</div>

<nav class="middle-tab-bar" id="middle-menu-bar" style="display: flex;">
  <button class="tab-btn active" data-cat="all" onclick="switchMiddleTab('all')">全部表示</button>
  <button class="tab-btn" data-cat="news" onclick="switchMiddleTab('news')">最新のお知らせ</button>
  <button class="tab-btn" data-cat="event" onclick="switchMiddleTab('event')">地域イベント</button>
</nav>

<div class="container">
  <main class="main-content" id="main-content-area">
    <div class="grid" id="photo-grid"></div>
  </main>

  <aside class="sidebar">
    <div class="sidebar-sticky">
      <div class="widget">
        <h2 class="widget-title">🔍 タグで絞り込む</h2>
        <div class="tag-list" id="tag-list"></div>
      </div>
      
      <div class="widget">
        <h2 class="widget-title">🎵 TikTok</h2>
        <div class="sns-placeholder">TikTokのタイムラインフィードがここに入るよ！</div>
      </div>

      <div class="widget">
        <h2 class="widget-title">📸 Instagram</h2>
        <div class="sns-placeholder">Instagramのタイムラインフィードがここに入るよ！</div>
      </div>

      <a href="https://twitter.com" class="twitter-banner" target="_blank">
        X (Twitter) で最新情報をチェック！ ↗
      </a>
    </div>
  </aside>
</div>

<script>
let allData = [];
let currentMiddleCat = 'all'; // 下のタブ状態（all / news / event）
let currentTagName = '';      // 選択中のタグ
let mode = 'top';             // トップバーの状態（top / about / program）

document.addEventListener('DOMContentLoaded', () => {
  // data.jsonをロード
  fetch('data.json')
    .then(res => {
      if (!res.ok) throw new Error('data.jsonが読み込めないよ💦');
      return res.json();
    })
    .then(data => {
      allData = data;
      // 開いた瞬間はTOPモードなので、カードとタグを初期描写！
      renderDataGrid();
    })
    .catch(err => {
      console.error("JSON読み込みエラー:", err);
      allData = [];
      renderDataGrid();
    });
});

// 📁 【トップバー】をクリックした時の超スッキリ出し分けロジック！
function switchTopNav(targetMode) {
  mode = targetMode;
  currentTagName = ''; // タグ選択をリセット
  
  // トップバーのアクティブ表示を切り替え
  document.querySelectorAll('.top-nav-item').forEach(el => {
    el.classList.remove('active');
    if (el.getAttribute('data-tab') === targetMode) el.classList.add('active');
  });

  const display = document.getElementById('main-content-area');
  const middleBar = document.getElementById('middle-menu-bar');

  if (targetMode === 'top') {
    // 【おにーちゃん指定】TOPの時だけ真ん中メニューを表示！！
    middleBar.style.display = 'flex'; 
    currentMiddleCat = 'all'; // カテゴリを全部表示にリセット
    resetMiddleTabActive();
    renderDataGrid(); // 写真カードを再描写
  } 
  else if (targetMode === 'about') {
    // TOP以外は真ん中メニューを非表示に消し去る！
    middleBar.style.display = 'none'; 
    
    display.innerHTML = `
      <div class="info-box">
        <h2>🌱 園について</h2>
        <p>ひまわりキッズガーデンでは、一人ひとりの個性を大切に、のびのびと育つ環境を提供しています。安心安全な環境の中で、お友達や先生とたくさんのワクワクを見つけていきます。</p>
        <p style="margin-top:15px;">【教育・保育方針】<br>・心身ともに健康で、たくましい子ども<br>・自分で考え、のびのびと表現できる子ども<br>・思いやりの心を持てる子ども</p>
      </div>`;
    updateSidebarTags(allData); 
  } 
  else if (targetMode === 'program') {
    // 当然すくわくプログラムでも真ん中メニューは非表示！
    middleBar.style.display = 'none'; 
    
    display.innerHTML = `
      <div class="info-box">
        <h2>✨ すくわくプログラム</h2>
        <p>子どもたちが五感をフル使って「わくわく」を体験する、当園オリジナルの特別カリキュラムです！自然探究、音遊び、創作活動など、遊びの中から生きる力を学んでいきます。</p>
        <p style="margin-top: 15px;">季節ごとのプログラムや、外部講師を招いた楽しいイベントも盛りだくさんですッ！</p>
      </div>`;
    updateSidebarTags(allData);
  }
}

// 📁 【真ん中のメニュー（タブ）】をクリックした時
function switchMiddleTab(cat) {
  currentMiddleCat = cat;
  currentTagName = ''; // タグ選択は一度リセット！
  
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.getAttribute('data-cat') === cat) btn.classList.add('active');
  });

  renderDataGrid();
}

// 真ん中メニューのボタンアクティブ状態を「全部表示」に戻す関数
function resetMiddleTabActive() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.getAttribute('data-cat') === 'all') btn.classList.add('active');
  });
}

// 写真カードグリッドを描画するメイン関数
function renderDataGrid() {
  const display = document.getElementById('main-content-area');
  display.innerHTML = '<div class="grid" id="photo-grid"></div>';
  const grid = document.getElementById('photo-grid');

  // 真ん中メニューのカテゴリ（最新 or 地域 or 全部）でフィルター
  let filtered = allData;
  if (currentMiddleCat !== 'all') {
    filtered = allData.filter(d => d && d.category === currentMiddleCat);
  }

  // 右側のタグリストは、選ばれているカテゴリに連動させて更新
  updateSidebarTags(filtered);

  // さらに右カラムでタグが選ばれていたら絞り込む
  if (currentTagName) {
    filtered = filtered.filter(d => d && d.tags && d.tags.includes(currentTagName));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; color:#9a8f84;">お写真がありません📷</p>';
    return;
  }

  filtered.forEach(item => {
    if (!item) return;
    const card = document.createElement('div');
    card.className = 'card';
    
    let tagsHtml = '';
    if (item.tags && Array.isArray(item.tags)) {
      tagsHtml = item.tags.map(t => `<span style="font-size:11px; color:#bf8740; background:rgba(216,163,93,0.05); padding:3px 8px; border-radius:4px; font-weight:
