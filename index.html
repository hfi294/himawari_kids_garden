<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>すくわくネットワーク ポータル</title>
<style>
/* --- 最初の洗練された基本スタイル --- */
body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  background-color: #fcfaf2;
  color: #4a433c;
  margin: 0;
  padding: 0;
  line-height: 1.6;
}

/* --- 📁 【完全復元】法人ロゴ＆HPリンク付き最上部ヘッダー --- */
header {
  background-color: transparent; /* 最初の透明感ある空気感を維持 */
  max-width: 1300px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  justify-content: space-between; /* 左にロゴ、右にHPリンクの黄金比！ */
  align-items: center;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #4a433c;
}
.logo-mark {
  background-color: #d8a35d;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
}
.logo-text {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 1px;
}
.corporate-nav {
  display: flex;
  gap: 20px;
}
.corporate-link {
  color: #7b5b35;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  transition: color 0.2s;
}
.corporate-link:hover {
  color: #d8a35d;
}

/* --- 📁 ヒーローの下に配置されたスマートなカテゴリメニュー（すべて表示は廃止！） --- */
.category-section {
  max-width: 1300px;
  margin: 0 auto;
  padding: 10px 20px 0 20px;
}
.category-nav {
  display: flex;
  gap: 12px;
}
.category-btn {
  background-color: transparent;
  color: #7b5b35;
  border: 1px solid #e8dfd2;
  padding: 8px 20px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.category-btn:hover {
  background-color: #f4f0e6;
  border-color: #d8a35d;
}
.category-btn.active {
  background-color: #d8a35d;
  color: white;
  border-color: #d8a35d;
}

/* --- 🌟 ヒーローイメージ --- */
.hero-section {
  position: relative;
  width: 100%;
  height: 380px;
  background: #efe5d5 url('images/hero.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
}
.hero-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(74, 67, 60, 0.35);
}
.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  color: white;
  padding: 0 20px;
}
.hero-content h1 {
  margin: 0;
  font-size: 34px;
  font-weight: bold;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  letter-spacing: 2px;
}
.hero-content p {
  margin: 15px 0 0 0;
  font-size: 15px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* --- 📦 2カラムレイアウト（左メイン：右タグサイドバー） --- */
.container {
  max-width: 1300px;
  margin: 0 auto;
  padding: 40px 20px;
}
.main-layout {
  display: flex;
  gap: 40px;
}

/* --- 🖼️ 【左側】フォトカードグリッド --- */
.content-area {
  flex-grow: 1;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 30px;
}
.card {
  background-color: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.02);
  border: 1px solid #e8dfd2;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 28px rgba(216,163,93,0.1);
}
.card-img-wrapper {
  position: relative;
  width: 100%;
  padding-top: 65%;
  background-color: #efe5d5;
}
.card-img {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover;
}
.card-content {
  padding: 22px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}
.card-title {
  margin: 0 0 10px 0;
  font-size: 18px;
  color: #4a433c;
  font-weight: bold;
}
.card-desc {
  margin: 0 0 18px 0;
  font-size: 13.5px;
  color: #746b63;
  flex-grow: 1;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}
.card-hash-tag {
  font-size: 11px;
  color: #bf8740;
  background-color: rgba(216,163,93,0.05);
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: bold;
}
.no-data {
  text-align: center;
  padding: 40px 20px;
  color: #8f6b3d;
  font-size: 15px;
}

/* --- 🔍 【右側】おにーちゃん指定：タグ絞り込みサイドバー --- */
.sidebar {
  width: 280px;
  flex-shrink: 0;
}
.sidebar-sticky {
  position: sticky;
  top: 30px;
}
.tag-block {
  background: white;
  border: 1px solid #e8dfd2;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.01);
}
.tag-block h2 {
  font-size: 14px;
  color: #8f6b3d;
  margin-top: 0;
  margin-bottom: 15px;
  letter-spacing: 1px;
}
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-btn {
  background-color: #f4f0e6;
  color: #6b6258;
  border: 1px solid #e8dfd2;
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.tag-btn:hover {
  background-color: #ebdcb9;
  border-color: #d8a35d;
  color: #7b5b35;
}
.tag-btn.active {
  background-color: #7b5b35;
  border-color: #7b5b35;
  color: white;
}

/* --- スマホ対応 --- */
@media (max-width: 900px) {
  header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }
  .category-section {
    padding: 0 15px;
  }
  .category-nav {
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .category-btn {
    padding: 6px 14px;
    font-size: 12px;
  }
  .hero-section {
    height: 240px;
  }
  .hero-content h1 {
    font-size: 24px;
  }
  .main-layout {
    flex-direction: column-reverse;
  }
  .sidebar {
    width: 100%;
  }
  .sidebar-sticky {
    position: static;
  }
}
</style>
</head>
<body>

<!-- 📁 【最上部】おにーちゃんの記憶通り！ロゴ＆法人リンクのオフィシャルヘッダー -->
<header>
  <a href="#" class="logo-area">
    <div class="logo-mark">🌱</div>
    <span class="logo-text">すくわくネットワーク</span>
  </a>
  <nav class="corporate-nav">
    <a href="https://example.com/corporate" class="corporate-link" target="_blank">法人HP ↗</a>
    <a href="https://example.com/contact" class="corporate-link" target="_blank">お問い合わせ ↗</a>
  </nav>
</header>

<!-- 📁 カテゴリ選択エリア（「すべて表示」を撤廃してスマートに！） -->
<div class="category-section">
  <nav class="category-nav">
    <!-- 最初のカテゴリ「最新のお知らせ」をデフォルトで選択状態にするよ！ -->
    <button class="category-btn active" data-category="news">最新のお知らせ</button>
    <button class="category-btn" data-category="event">地域イベント</button>
    <button class="category-btn" data-category="program">すくわくプログラム</button>
  </nav>
</div>

<!-- 🌟 美しいヒーローセクション -->
<div class="hero-section">
  <div class="hero-content">
    <h1>🌱 すくわくネットワーク ポータル</h1>
    <p>子どもたちの笑顔あふれる日常と、ワクワクするプログラムを配信中！</p>
  </div>
</div>

<!-- 📦 2カラム（左メイン写真 / 右タグサイドバー） -->
<div class="container">
  <div class="main-layout">
    
    <!-- 🖼️ 左側：メインカード表示エリア -->
    <main class="content-area">
      <div class="grid" id="photo-grid">
        <!-- ここにおにーちゃんのデータが並ぶよ！ -->
      </div>
    </main>

    <!-- 🔍 右側：タグフィルターサイドバー -->
    <aside class="sidebar">
      <div class="sidebar-sticky">
        <div class="tag-block" id="tag-filter-block" style="display: none;">
          <h2>🔍 タグでさらに絞り込む</h2>
          <div class="tag-list" id="tag-list"></div>
        </div>
      </div>
    </aside>

  </div>
</div>

<script>
// ※デフォルトのカテゴリを「news」にセットするよ！
let allData = [];
let currentCat = 'news'; 
let currentTag = '';

document.addEventListener('DOMContentLoaded', () => {
  fetch('data.json')
    .then(response => {
      if (!response.ok) throw new Error('data.json が読み込めないよ💦');
      return response.json();
    })
    .then(data => {
      allData = data;
      renderPage();
    })
    .catch(error => {
      console.error(error);
      document.getElementById('photo-grid').innerHTML = `<div class="no-data">データの読み込みに失敗しちゃった……配置を確認してみてね、おにーちゃん！😭</div>`;
    });

  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentCat = e.target.getAttribute('data-category');
      currentTag = ''; 
      renderPage();
    });
  });
});

function renderPage() {
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = '';

  // 選択されたカテゴリだけでバシッとフィルタリング！
  let filtered = allData.filter(item => {
    if (currentCat === 'news' && item.category === 'program') return true;
    return item.category === currentCat;
  });

  updateTagFilterArea(filtered);

  if (currentTag) {
    filtered = filtered.filter(item => item.tags && item.tags.includes(currentTag));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-data">該当するお写真はまだありません📷</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    let tagsHtml = '';
    if (item.tags && item.tags.length > 0) {
      tagsHtml = item.tags.map(t => `<span class="card-hash-tag">#${t}</span>`).join('');
    }

    card.innerHTML = `
      <div class="card-img-wrapper">
        <img src="${item.img}" class="card-img" alt="${item.title}" loading="lazy">
      </div>
      <div class="card-content">
        <h2 class="card-title">${item.title}</h2>
        <p class="card-desc">${item.desc}</p>
        <div class="card-tags">${tagsHtml}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateTagFilterArea(currentData) {
  const filterBlock = document.getElementById('tag-filter-block');
  const tagListContainer = document.getElementById('tag-list');
  const tagSet = new Set();
  
  currentData.forEach(item => {
    if (item.tags) item.tags.forEach(t => tagSet.add(t));
  });

  if (tagSet.size === 0) {
    filterBlock.style.display = 'none';
    currentTag = '';
    return;
  }

  filterBlock.style.display = 'block';
  tagListContainer.innerHTML = '';

  const allTagBtn = document.createElement('button');
  allTagBtn.className = `tag-btn ${currentTag === '' ? 'active' : ''}`;
  allTagBtn.textContent = 'すべて解除';
  allTagBtn.addEventListener('click', () => {
    currentTag = '';
    renderPage();
  });
  tagListContainer.appendChild(allTagBtn);

  tagSet.forEach(tagName => {
    const btn = document.createElement('button');
    btn.className = `tag-btn ${currentTag === tagName ? 'active' : ''}`;
    btn.textContent = `#${tagName}`;
    btn.addEventListener('click', () => {
      currentTag = (currentTag === tagName) ? '' : tagName;
      renderPage();
    });
    tagListContainer.appendChild(btn);
  });
}
</script>

</body>
</html>
